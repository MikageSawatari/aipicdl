[package]
name = "aipicdl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Archive all public posts of an Aipictors user and browse them locally as static HTML"
license = "MIT"
repository = "https://github.com/MikageSawatari/aipicdl"
readme = "README.md"

[dependencies]
eframe = "0.33"
egui = "0.33"
rfd = "0.15"
ureq = { version = "3", features = ["json"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
